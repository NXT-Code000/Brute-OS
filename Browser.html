<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Browser</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Segoe UI", sans-serif;
    background: #020617;
    color: #e5e7eb;
    height: 100vh;
    overflow: hidden;
  }

  /* HEADER */
  #header {
    height: 10vh;
    min-height: 60px;
    background: #020617;
    border-bottom: 1px solid #1f2937;
    display: flex;
    align-items: center;
    padding: 0 20px;
    transition: 0.3s ease;
  }

  #app-title {
    font-size: 1.4rem;
    color: #38bdf8;
    font-weight: 600;
    opacity: 1;
    transition: 0.3s ease;
  }

  /* Suchleiste */
  #search-container {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 60%;
    max-width: 600px;
    display: flex;
    gap: 10px;
    transition: 0.4s ease;
  }

  #search-input {
    flex: 1;
    padding: 14px 20px;
    border-radius: 999px;
    border: 1px solid #1f2937;
    background: #020617;
    color: #e5e7eb;
    font-size: 1.1rem;
    outline: none;
  }

  #search-input:focus {
    border-color: #38bdf8;
  }

  #search-btn {
    padding: 14px 24px;
    border-radius: 999px;
    border: none;
    background: #38bdf8;
    color: #000;
    font-weight: 600;
    cursor: pointer;
    font-size: 1rem;
  }

  #search-btn:hover {
    background: #0ea5e9;
  }

  /* MAIN */
  #main {
    height: 90vh;
    background: #020617;
    overflow-y: auto;
    padding: 20px;
  }

  /* Search results */
  .result {
    background: #0b1120;
    border: 1px solid #1f2937;
    padding: 16px;
    border-radius: 10px;
    margin-bottom: 16px;
  }

  .result-title {
    font-size: 1.2rem;
    color: #38bdf8;
    margin-bottom: 6px;
  }

  .result-title a {
    color: #38bdf8;
    text-decoration: none;
  }

  .result-title a:hover {
    text-decoration: underline;
  }

  .result-url {
    font-size: 0.8rem;
    color: #22c55e;
    margin-bottom: 8px;
  }

  .result-snippet {
    font-size: 0.9rem;
    color: #cbd5e1;
  }

  /* After search → move bar up */
  .search-active #search-container {
    top: 15px;
    left: 20px;
    transform: none;
    width: 40%;
    max-width: 450px;
  }

  .search-active #app-title {
    opacity: 0;
  }
</style>
</head>
<body>

<!-- HEADER -->
<div id="header">
  <div id="app-title">Browser</div>
</div>

<!-- SUCHLEISTE -->
<div id="search-container">
  <input id="search-input" type="text" placeholder="Suche eingeben...">
  <button id="search-btn">Suchen</button>
</div>

<!-- MAIN -->
<div id="main">
  <div id="results"></div>
</div>

<script>
  const searchInput = document.getElementById("search-input");
  const searchBtn = document.getElementById("search-btn");
  const resultsDiv = document.getElementById("results");

  async function search() {
    const q = searchInput.value.trim();
    if (!q) return;

    document.body.classList.add("search-active");
    resultsDiv.innerHTML = "";

    // DuckDuckGo HTML scrapen über AllOrigins (funktioniert IMMER)
    const url =
      "https://api.allorigins.win/get?url=" +
      encodeURIComponent("https://duckduckgo.com/html/?q=" + encodeURIComponent(q));

    const res = await fetch(url);
    const data = await res.json();

    // HTML parsen
    const parser = new DOMParser();
    const doc = parser.parseFromString(data.contents, "text/html");

    const items = [...doc.querySelectorAll(".result__body")];

    if (items.length === 0) {
      resultsDiv.innerHTML = "<p style='color:#6b7280;'>Keine Ergebnisse gefunden.</p>";
      return;
    }

    items.forEach(item => {
      const titleEl = item.querySelector(".result__title a");
      const snippetEl = item.querySelector(".result__snippet");

      if (!titleEl) return;

      const title = titleEl.innerText;
      const link = titleEl.href;
      const snippet = snippetEl ? snippetEl.innerText : "";

      const div = document.createElement("div");
      div.className = "result";

      div.innerHTML = `
        <div class="result-title"><a href="${link}" target="_blank">${title}</a></div>
        <div class="result-url">${link}</div>
        <div class="result-snippet">${snippet}</div>
      `;

      resultsDiv.appendChild(div);
    });
  }

  searchBtn.addEventListener("click", search);
  searchInput.addEventListener("keydown", e => {
    if (e.key === "Enter") search();
  });
</script>

</body>
</html>
