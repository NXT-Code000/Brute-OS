<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Brute OS Desktop</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        font-family: Arial, sans-serif;
        color: #e5e5e5;

        /* Dein echtes Wallpaper */
        background: url("Startpage.png") no-repeat center center fixed;
        background-size: cover;
    }

    /* SYSTEM INFO */
    .system-info {
        position: absolute;
        top: 15px;
        right: 20px;
        text-align: right;
        font-size: 0.9rem;
        line-height: 1.4rem;
        color: #ccc;
        background: rgba(20,20,20,0.55);
        padding: 10px 14px;
        border-radius: 10px;
        border: 1px solid #333;
        backdrop-filter: blur(4px);
    }

    #weather {
        cursor: pointer;
        text-decoration: underline;
    }

    /* TASKBAR */
    .taskbar {
        position: absolute;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 22px;
        background: rgba(20,20,20,0.7);
        padding: 14px 26px;
        border-radius: 20px;
        border: 1px solid #333;
        box-shadow: 0 0 25px rgba(0,0,0,0.6);
        backdrop-filter: blur(6px);
    }

    .app {
        width: 70px;
        height: 70px;
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 14px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: 0.2s;
        text-align: center;
        font-size: 0.75rem;
    }

    .app:hover {
        background: #222;
        transform: translateY(-4px);
    }

    .icon {
        width: 38px;
        height: 38px;
        background: #444;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 1rem;
        margin-bottom: 5px;
        color: #fff;
    }
</style>
</head>

<body>

<!-- SYSTEM INFO -->
<div class="system-info">
    <div id="internet">Internet: prüfen…</div>
    <div id="weather" onclick="changePLZ()">Wetter: …</div>
    <div id="datetime">--:--</div>
</div>

<!-- TASKBAR -->
<div class="taskbar">
    <div class="app"><div class="icon">W</div>Word</div>
    <div class="app"><div class="icon">X</div>Excel</div>
    <div class="app"><div class="icon">P</div>PowerP.</div>
    <div class="app"><div class="icon">O</div>OneNote</div>
    <div class="app"><div class="icon">PDF</div>PDF</div>
    <div class="app"><div class="icon">N</div>Notizen</div>
    <div class="app"><div class="icon">K</div>Kalender</div>
    <div class="app"><div class="icon">B</div>Browser</div>
</div>

<script>
/* DATUM + UHRZEIT */
function updateClock() {
    const now = new Date();
    const dd = String(now.getDate()).padStart(2, "0");
    const mm = String(now.getMonth() + 1).padStart(2, "0");
    const yyyy = now.getFullYear();
    const date = `${dd}.${mm}.${yyyy}`;
    const time = now.toLocaleTimeString("de-DE", {hour: "2-digit", minute: "2-digit"});
    document.getElementById("datetime").textContent = date + " · " + time;
}
setInterval(updateClock, 1000);
updateClock();

/* INTERNET */
function checkInternet() {
    fetch("https://example.com", {mode: "no-cors"})
        .then(() => document.getElementById("internet").textContent = "Internet: Online")
        .catch(() => document.getElementById("internet").textContent = "Internet: Offline");
}
checkInternet();

/* WETTER */
let PLZ = "92364";

async function loadWeather() {
    try {
        const geo = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${PLZ}&count=1`)
            .then(r => r.json());

        const { latitude, longitude } = geo.results[0];

        const weather = await fetch(
            `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m`
        ).then(r => r.json());

        document.getElementById("weather").textContent =
            "Wetter: " + weather.current.temperature_2m + "°C";
    } catch {
        document.getElementById("weather").textContent = "Wetter: Fehler";
    }
}
loadWeather();

/* PLZ ändern */
function changePLZ() {
    const newPLZ = prompt("Neue Postleitzahl eingeben:", PLZ);
    if (!newPLZ) return;
    PLZ = newPLZ;
    loadWeather();
}
</script>

</body>
</html>
