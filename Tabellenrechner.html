<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Tabellenrechner</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: #0a0a0a;
      color: #e5e7eb;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    #header {
      height: 10vh;
      min-height: 60px;
      background: #0d0d0d;
      border-bottom: 1px solid #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }

    #header-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    #app-title {
      font-size: 1.8rem;
      color: #ffffff;
      font-weight: 600;
      letter-spacing: 1px;
    }

    #header-right button {
      margin-left: 10px;
      padding: 8px 14px;
      background: #1f1f1f;
      color: #e5e7eb;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: 0.15s;
    }

    #header-right button:hover {
      background: #2a2a2a;
      border-color: #3a3a3a;
    }

    /* Hauptbereich */
    #main {
      height: 90vh;
      display: flex;
      flex-direction: column;
      background: #0a0a0a;
    }

    /* Eingabezeile */
    #formula-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-bottom: 1px solid #1a1a1a;
      background: #0d0d0d;
      font-size: 0.9rem;
    }

    #cell-label {
      min-width: 60px;
      text-align: center;
      background: #111;
      border-radius: 6px;
      padding: 6px 8px;
      border: 1px solid #1f1f1f;
      color: #9ca3af;
    }

    #formula-input {
      flex: 1;
      background: #111;
      border-radius: 6px;
      border: 1px solid #1f1f1f;
      padding: 6px 10px;
      color: #e5e7eb;
      outline: none;
      font-size: 0.9rem;
    }

    #formula-input:focus {
      border-color: #3a3a3a;
    }

    /* Tabellenbereich */
    #grid-wrapper {
      flex: 1;
      overflow: auto;
      padding: 10px;
      background: #0a0a0a;
    }

    table {
      border-collapse: collapse;
      background: #0d0d0d;
      border: 1px solid #1a1a1a;
    }

    th, td {
      border: 1px solid #1a1a1a;
      min-width: 70px;
      height: 26px;
      padding: 4px 6px;
      font-size: 0.85rem;
    }

    th {
      background: #111;
      color: #9ca3af;
      text-align: center;
      font-weight: 500;
    }

    td {
      background: #0f0f0f;
      color: #e5e7eb;
      cursor: pointer;
      position: relative;
    }

    td.selected {
      outline: 2px solid #3a3a3a;
      outline-offset: -2px;
    }

    /* Statusbar */
    #statusbar {
      padding: 6px 12px;
      font-size: 0.8rem;
      color: #777;
      border-top: 1px solid #1a1a1a;
      background: #0d0d0d;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>

  <div id="header">
    <div id="header-left">
      <div id="app-title">Tabellenrechner</div>
    </div>
    <div id="header-right">
      <button id="saveBtn">Speichern (.tkb)</button>
      <button id="loadBtn">Öffnen (.tkb)</button>
    </div>
  </div>

  <div id="main">
    <!-- Eingabezeile -->
    <div id="formula-bar">
      <div id="cell-label">–</div>
      <input id="formula-input" type="text" placeholder="=A1+B1 oder Wert eingeben …">
    </div>

    <!-- Tabelle -->
    <div id="grid-wrapper">
      <table id="grid"></table>
    </div>

    <!-- Statusbar -->
    <div id="statusbar">
      <span id="status-cell">Keine Zelle ausgewählt</span>
      <span id="status-info">Formeln: =A1+B2, =A1*2, =A1/B1 …</span>
    </div>
  </div>

  <script>
    const ROWS = 20;
    const COLS = 10;

    const grid = document.getElementById("grid");
    const formulaInput = document.getElementById("formula-input");
    const cellLabel = document.getElementById("cell-label");
    const statusCell = document.getElementById("status-cell");
    const saveBtn = document.getElementById("saveBtn");
    const loadBtn = document.getElementById("loadBtn");

    const cells = {};
    let selectedCellId = null;

    function colIndexToName(index) {
      return String.fromCharCode("A".charCodeAt(0) + index);
    }

    function createGrid() {
      const thead = document.createElement("thead");
      const headRow = document.createElement("tr");

      const corner = document.createElement("th");
      corner.textContent = "";
      headRow.appendChild(corner);

      for (let c = 0; c < COLS; c++) {
        const th = document.createElement("th");
        th.textContent = colIndexToName(c);
        headRow.appendChild(th);
      }
      thead.appendChild(headRow);
      grid.appendChild(thead);

      const tbody = document.createElement("tbody");
      for (let r = 1; r <= ROWS; r++) {
        const tr = document.createElement("tr");

        const rowHeader = document.createElement("th");
        rowHeader.textContent = r;
        tr.appendChild(rowHeader);

        for (let c = 0; c < COLS; c++) {
          const td = document.createElement("td");
          const colName = colIndexToName(c);
          const cellId = colName + r;
          td.dataset.cellId = cellId;
          td.addEventListener("click", () => selectCell(cellId));
          tr.appendChild(td);
        }

        tbody.appendChild(tr);
      }
      grid.appendChild(tbody);
    }

    function selectCell(cellId) {
      const prev = grid.querySelector("td.selected");
      if (prev) prev.classList.remove("selected");

      const td = grid.querySelector(`td[data-cell-id="${cellId}"]`);
      if (!td) return;

      td.classList.add("selected");
      selectedCellId = cellId;
      cellLabel.textContent = cellId;
      statusCell.textContent = "Zelle: " + cellId;

      const data = cells[cellId];
      formulaInput.value = data ? data.raw : "";
      formulaInput.focus();
    }

    function setCellRaw(cellId, raw) {
      if (!cells[cellId]) cells[cellId] = { raw: "", value: "" };
      cells[cellId].raw = raw;
      recalcAll();
    }

    function recalcAll() {
      for (const key in cells) {
        cells[key].value = evaluateCell(key);
      }
      renderGrid();
    }

    function evaluateCell(cellId) {
      const data = cells[cellId];
      if (!data || data.raw === "") return "";

      const raw = data.raw.toString().trim();

      if (!raw.startsWith("=")) {
        const num = Number(raw.replace(",", "."));
        return isNaN(num) ? raw : num;
      }

      let expr = raw.slice(1);

      expr = expr.replace(/([A-Z]+[0-9]+)/g, (match) => {
        const ref = cells[match];
        if (!ref) return "0";
        const v = ref.value ?? evaluateCell(match);
        return typeof v === "number" ? v : parseFloat(v) || 0;
      });

      try {
        const result = Function("return " + expr)();
        return typeof result === "number" ? result : "";
      } catch {
        return "#FEHLER";
      }
    }

    function renderGrid() {
      const tds = grid.querySelectorAll("td[data-cell-id]");
      tds.forEach(td => {
        const id = td.dataset.cellId;
        const data = cells[id];
        td.textContent = data ? data.value : "";
      });
    }

    formulaInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        if (!selectedCellId) return;
        setCellRaw(selectedCellId, formulaInput.value);
      }
    });

    // Speichern (.tkb)
    saveBtn.addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(cells)], { type: "application/json;charset=utf-8" });
      let name = prompt("Dateiname:", "Tabelle");
      if (!name) return;
      if (!name.toLowerCase().endsWith(".tkb")) name += ".tkb";

      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = name;
      link.click();
      URL.revokeObjectURL(link.href);
    });

    // Öffnen (.tkb)
    loadBtn.addEventListener("click", () => {
      const input = document.createElement("input");
      input.type = "file";
      input.accept = ".tkb,application/json";

      input.onchange = () => {
        const file = input.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = () => {
          try {
            const data = JSON.parse(reader.result);
            Object.keys(cells).forEach(k => delete cells[k]);
            Object.assign(cells, data);
            recalcAll();
          } catch {
            alert("Datei konnte nicht gelesen werden.");
          }
        };
        reader.readAsText(file, "UTF-8");
      };

      input.click();
    });

    createGrid();
    renderGrid();
  </script>

</body>
</html>
