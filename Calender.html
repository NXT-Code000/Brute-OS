<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Calender</title>

<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background: #0a0a0a;
        color: #e5e7eb;
        height: 100vh;
        display: flex;
        flex-direction: column;
    }

    /* HEADER */
    #header {
        height: 10vh;
        min-height: 60px;
        background: #0d0d0d;
        border-bottom: 1px solid #1a1a1a;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
    }

    #app-title {
        font-size: 1.8rem;
        color: #fff;
        font-weight: 600;
        letter-spacing: 1px;
    }

    #header-right button {
        margin-left: 10px;
        padding: 8px 14px;
        background: #1f1f1f;
        color: #e5e7eb;
        border: 1px solid #2a2a2a;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        font-size: 0.9rem;
        transition: 0.15s;
    }

    #header-right button:hover {
        background: #2a2a2a;
        border-color: #3a3a3a;
    }

    /* MAIN */
    #main {
        height: 90vh;
        display: flex;
        background: #0a0a0a;
    }

    /* LEFT: MONTH VIEW */
    #month-view {
        width: 60%;
        padding: 20px;
        border-right: 1px solid #1a1a1a;
        overflow-y: auto;
    }

    #month-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
    }

    #month-header button {
        padding: 6px 12px;
        background: #1f1f1f;
        border: 1px solid #2a2a2a;
        border-radius: 6px;
        color: #e5e7eb;
        cursor: pointer;
    }

    #month-header button:hover {
        background: #2a2a2a;
    }

    #calendar-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 6px;
    }

    .day-name {
        text-align: center;
        font-size: 0.85rem;
        color: #9ca3af;
        padding-bottom: 6px;
    }

    .day {
        background: #111;
        border: 1px solid #1f1f1f;
        border-radius: 6px;
        padding: 10px;
        min-height: 80px;
        cursor: pointer;
        transition: 0.15s;
    }

    .day:hover {
        border-color: #38bdf8;
    }

    .day.today {
        border-color: #38bdf8;
        background: #1a1a1a;
    }

    .day.has-events {
        border-color: #22c55e;
    }

    /* RIGHT: DAY DETAILS */
    #day-details {
        width: 40%;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    #selected-date {
        font-size: 1.3rem;
        font-weight: 600;
    }

    #events-list {
        flex: 1;
        overflow-y: auto;
        border: 1px solid #1f1f1f;
        background: #111;
        border-radius: 8px;
        padding: 10px;
    }

    .event-item {
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        padding: 8px;
        border-radius: 6px;
        margin-bottom: 8px;
        font-size: 0.9rem;
    }

    .event-item button {
        float: right;
        background: #e11d48;
        border: none;
        padding: 4px 8px;
        border-radius: 4px;
        cursor: pointer;
        color: #fff;
        font-size: 0.75rem;
    }

    #new-event-input {
        width: 100%;
        padding: 8px;
        background: #111;
        border: 1px solid #1f1f1f;
        border-radius: 6px;
        color: #e5e7eb;
        outline: none;
    }

    #new-event-input:focus {
        border-color: #38bdf8;
    }

    #add-event-btn {
        padding: 8px 14px;
        background: #22c55e;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        color: #000;
    }

    #add-event-btn:hover {
        background: #16a34a;
    }

    /* FOOTER */
    #footer {
        height: 40px;
        background: #0d0d0d;
        border-top: 1px solid #1a1a1a;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 15px;
        font-size: 0.85rem;
        color: #777;
    }
</style>
</head>
<body>

<!-- HEADER -->
<div id="header">
    <div id="app-title">Calender</div>

    <div id="header-right">
        <button id="saveBtn">Speichern (.clb)</button>
        <button id="loadBtn">Öffnen (.clb)</button>
    </div>
</div>

<!-- MAIN -->
<div id="main">

    <!-- MONTH VIEW -->
    <div id="month-view">
        <div id="month-header">
            <button id="prevMonth">←</button>
            <div id="month-title"></div>
            <button id="nextMonth">→</button>
        </div>

        <div id="calendar-grid"></div>
    </div>

    <!-- DAY DETAILS -->
    <div id="day-details">
        <div id="selected-date">Kein Tag ausgewählt</div>

        <div id="events-list"></div>

        <input id="new-event-input" type="text" placeholder="Neuer Termin...">
        <button id="add-event-btn">Hinzufügen</button>
    </div>
</div>

<!-- FOOTER -->
<div id="footer">
    <span id="status">Bereit</span>
    <span>Calender · .clb · Termine speichern & laden</span>
</div>

<script>
    let events = {}; // { "YYYY-MM-DD": ["Event 1", "Event 2"] }
    let currentDate = new Date();
    let selectedDate = null;

    const monthTitle = document.getElementById("month-title");
    const calendarGrid = document.getElementById("calendar-grid");
    const selectedDateLabel = document.getElementById("selected-date");
    const eventsList = document.getElementById("events-list");
    const newEventInput = document.getElementById("new-event-input");
    const status = document.getElementById("status");

    function formatDate(date) {
        return date.toISOString().split("T")[0];
    }

    function renderCalendar() {
        calendarGrid.innerHTML = "";

        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();

        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);

        const dayNames = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
        dayNames.forEach(d => {
            const div = document.createElement("div");
            div.className = "day-name";
            div.textContent = d;
            calendarGrid.appendChild(div);
        });

        let start = firstDay.getDay();
        if (start === 0) start = 7;

        for (let i = 1; i < start; i++) {
            const empty = document.createElement("div");
            calendarGrid.appendChild(empty);
        }

        for (let d = 1; d <= lastDay.getDate(); d++) {
            const date = new Date(year, month, d);
            const div = document.createElement("div");
            div.className = "day";
            div.textContent = d;

            const key = formatDate(date);
            if (events[key]?.length) div.classList.add("has-events");

            const today = new Date();
            if (date.toDateString() === today.toDateString()) {
                div.classList.add("today");
            }

            div.onclick = () => selectDay(date);
            calendarGrid.appendChild(div);
        }

        monthTitle.textContent = currentDate.toLocaleDateString("de-DE", {
            month: "long",
            year: "numeric"
        });
    }

    function selectDay(date) {
        selectedDate = formatDate(date);
        selectedDateLabel.textContent = date.toLocaleDateString("de-DE", {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
        });
        renderEvents();
    }

    function renderEvents() {
        eventsList.innerHTML = "";
        const list = events[selectedDate] || [];

        list.forEach((ev, i) => {
            const div = document.createElement("div");
            div.className = "event-item";
            div.textContent = ev;

            const del = document.createElement("button");
            del.textContent = "X";
            del.onclick = () => {
                events[selectedDate].splice(i, 1);
                renderEvents();
                renderCalendar();
            };

            div.appendChild(del);
            eventsList.appendChild(div);
        });
    }

    document.getElementById("add-event-btn").onclick = () => {
        if (!selectedDate) return alert("Bitte zuerst einen Tag auswählen.");
        const text = newEventInput.value.trim();
        if (!text) return;

        if (!events[selectedDate]) events[selectedDate] = [];
        events[selectedDate].push(text);

        newEventInput.value = "";
        renderEvents();
        renderCalendar();
    };

    document.getElementById("prevMonth").onclick = () => {
        currentDate.setMonth(currentDate.getMonth() - 1);
        renderCalendar();
    };

    document.getElementById("nextMonth").onclick = () => {
        currentDate.setMonth(currentDate.getMonth() + 1);
        renderCalendar();
    };

    // Speichern (.clb)
    document.getElementById("saveBtn").onclick = () => {
        const blob = new Blob([JSON.stringify(events)], { type: "application/json" });
        let name = prompt("Dateiname:", "Kalender");
        if (!name) return;
        if (!name.toLowerCase().endsWith(".clb")) name += ".clb";

        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = name;
        link.click();
    };

    // Öffnen (.clb)
    document.getElementById("loadBtn").onclick = () => {
        const input = document.createElement("input");
        input.type = "file";
        input.accept = ".clb,application/json";

        input.onchange = () => {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = () => {
                try {
                    events = JSON.parse(reader.result);
                    renderCalendar();
                    eventsList.innerHTML = "";
                    selectedDateLabel.textContent = "Kein Tag ausgewählt";
                } catch {
                    alert("Datei konnte nicht gelesen werden.");
                }
            };
            reader.readAsText(file);
        };

        input.click();
    };

    renderCalendar();
</script>

</body>
</html>
